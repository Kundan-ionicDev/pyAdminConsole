<div id="page-wrapper">
  <div class="col-md-12 graphs">
    <div class="xs">
      <h3>View Event</h3>
      <div class="container">
        <div class="row">
          <div class="col-lg-12">
            <div class="main-box clearfix">
              <div class="table-responsive scrolling_div">
                <table class="table user-list">
                  <thead>
                    <tr>
                      <th><span>Event Tite</span></th>
                      <th><span>Start Date</span></th>
                      <th><span>End Date</span></th>
                      <th><span>Address</span></th>
                      <th><span>Contact Name</span></th>
                      <th><span>Contact Number</span></th>
                      <th>Actions</th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr *ngFor="let event  of eventList">
                      <td>
                      <span class="user-subhead">{{ event.title }}</span>
                      </td>
                      <td>
                        <span class="user-subhead">{{ event.startDate | date : 'MMM dd yyyy h:mm a'  }}</span>
                      </td>
                      <td class="text-center">
                        <span class="user-subhead">{{ event.endDate | date : 'MMM dd yyyy h:mm a' }}</span>
                      </td>
                      <td>
                        <span class="user-subhead">{{ event.address }} </span>
                      </td>
                      <td>
                        <span class="user-subhead">{{ event.contactPersonName }}</span>
                      </td>
                      <td>
                        <span class="user-subhead">{{ event.contactPerson }}</span>
                      </td>
                      <td style="width: 20%;" >
                        <button (click)="previewEvent(event)" data-toggle="tooltip" title="click to preview event" data-placement="bottom"  class="btn-success btn">Preview
                         
                        </button> &nbsp;
                      </td>
                 
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
