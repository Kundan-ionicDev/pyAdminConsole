<div id="page-wrapper">
  <div class="graphs">
    <div class="xs">
      <h3>Coupon Entry/ Manage</h3>
      <div class="row">
        <div class="col-lg-12" style="float: right;">
          <button (click)="add()" *ngIf="showHide == false" class="btn-success btn">
            Add
          </button>

          <button (click)="add()" *ngIf="showHide == true" class="btn-success btn">
            Show Coupon list
          </button>
        </div>
      </div>
      <br />

      <div id="content" class="container" *ngIf="showHide == false">
        <div class="row">
          <div class="col-lg-12">
            <div class="main-box clearfix">
              <div class="table-responsive  scrolling_div">
                <table class="table user-list">
                  <thead>
                    <tr>
                      <th><span>Coupon Code</span></th>
                      <th><span>Description</span></th>
                      <th><span>Event Name</span></th>
                      <th><span>Expire</span></th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr *ngFor="let coupons of couponList">
                      <td class="text-center">
                        {{ coupons.code }}
                      </td>
                      <td>
                        {{ coupons.description }}
                      </td>
                      <td>
                        {{ coupons.fk_event.title }}
                      </td>
                      <td>
                        {{ coupons.endDate | date : 'EEEE, MMMM d, y'}}
                      </td>
                      <!-- <td style="width: 20%;">
                        <a href="" class="table-link">
                          <span class="fa-stack">
                            <i class="fa fa-square fa-stack-2x"></i>
                            <i class="fa fa-pencil fa-stack-1x fa-inverse"></i>
                          </span>
                        </a>
                        <a href="" class="table-link danger">
                          <span class="fa-stack">
                            <i class="fa fa-square fa-stack-2x"></i>
                            <i class="fa fa-trash-o fa-stack-1x fa-inverse"></i>
                          </span>
                        </a>
                      </td> -->

                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="tab-content" *ngIf="showHide == true">
        <div class="tab-pane active">
          <form role="form" [formGroup]="couponForm" (ngSubmit)="createCoupon()" class="form-horizontal">
            <div class="form-group">
              <label for="focusedinput" class="col-sm-2 control-label">Coupon Code </label>
              <div class="col-sm-8">
                <input type="text" class="form-control1" formControlName="couponcode" id="focusedinput"
                  placeholder="Name" [ngClass]="{ 'is-invalid': submitted && f.Name.errors }" />
                <div *ngIf="submitted && f.Name.errors" class="invalid-feedback">
                  <div *ngIf="f.Name.errors.required">Name is required</div>
                  <div *ngIf="f.Name.errors.email">Name must be a valid</div>
                </div>
              </div>
            </div>
            <div class="form-group">
              <label for="disabledinput" class="col-sm-2 control-label">Description</label>
              <div class="col-sm-8">
                <input type="text" formControlName="description" class="form-control1" id="disabledinput"
                  placeholder="Description" [ngClass]="{ 'is-invalid': submitted && f.description.errors }" />
                <div *ngIf="submitted && f.description.errors" class="invalid-feedback">
                  <div *ngIf="f.description.errors.required">Description is required</div>
                </div>
              </div>
            </div>


            <div class="form-group">
              <label for="selector1" class="col-sm-2 control-label">Event For</label>
              <div class="col-sm-8">
                <select name="selector1" id="selector1" formControlName="eventId" class="form-control1">
                  <option value="0">Select</option>
                  <option *ngFor="let events of eventList" [value]="events.eventId">{{ events.title }}</option>
                </select>
              </div>
            </div>

            <div class="form-group">
              <label for="inputPassword" class="col-sm-2 control-label">Expire Date</label>
              <div class="col-sm-8" data-toggle="tooltip" title="Select Expiry Date!" data-placement="bottom">
                <input [owlDateTime]="enddt1" [owlDateTimeTrigger]="enddt1" formControlName="expiredt"
                  class="form-control1" />
                <owl-date-time #enddt1></owl-date-time>
              </div>
            </div>

            <div class="panel-footer">
              <div class="row">
                <div class="col-sm-8 col-sm-offset-2">
                  <button class="btn-success btn">Submit</button> &nbsp;
                  <!-- <button class="btn-default btn">Cancel</button>&nbsp; -->
                </div>

              </div>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
  <ngx-loading [show]="loading" [config]="{animationType: ngxLoadingAnimationTypes.circleSwish, primaryColour: primaryColour, backdropBorderRadius: '3px'}"
  [template]="loadingTemplate"></ngx-loading>
