<h2 mat-dialog-title>
    Winner's are ...
</h2>

<mat-dialog-content>
    <mat-list role="list">
        <mat-list-item role="listitem" *ngFor="let winner of data">
            <div>
                {{ winner.name }}
            </div>
        </mat-list-item>
      </mat-list>
</mat-dialog-content>

<mat-dialog-actions text-center>
    <button mat-raised-button (click)="close()" color="primary">Ok</button>
</mat-dialog-actions>
