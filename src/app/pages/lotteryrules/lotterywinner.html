<h2 mat-dialog-title>
    Top 3 Winner's List
</h2>

<mat-dialog-content>
    <mat-list role="list">
        <mat-list-item role="listitem" *ngFor="let winner of data">
            <div>
                <span matBadge=" {{ winner.Rank }}" matBadgeOverlap="false">{{ winner.WinnerName }}</span>
            </div>
        </mat-list-item>
      </mat-list>
</mat-dialog-content>

<mat-dialog-actions text-center>
    <button mat-raised-button (click)="close()" color="primary">Ok</button>
</mat-dialog-actions>
