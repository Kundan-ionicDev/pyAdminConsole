<div id="page-wrapper">
  <div class="graphs">
    <div class="xs">
      <h3>Set Lottery Rules</h3>
      <div class="row">
        <form role="form" [formGroup]="lotteryrule" (ngSubmit)="generateRule()" class="form-horizontal">
          <div class="col-lg-2">
            <span>Select Events</span>
            <select formControlName="eventId" class="form-control1">
              <option selected value="0">Select Event</option>
              <option *ngFor="let cat of eventList" [value]="cat.eventId">{{cat.title}}</option>
            </select>
          </div>
          <div class="col-lg-2">
            <span>Select Coupon</span>
            <select formControlName="couponId" class="form-control1">
              <option selected value="0">Select Coupon</option>
              <option *ngFor="let coupn of couponList" [value]="coupn.couponId">{{ coupn.code }}</option>
            </select>
          </div>
          <div class="col-lg-2">
            <span>Rule 1</span>
            <select formControlName="rule1" class="form-control1">
              <option selected value="ALL">All(Both)</option>
              <option value="PRESENT">Present</option>
              <option value="ABSENT">Absent</option>
            </select>
          </div>
          <div class="col-lg-2">
            <span>Rule 2</span>
            <select formControlName="rule2" class="form-control1">
              <option selected value="0">Select Rule2</option>
              <option value="TOP3">Top 3</option>
              <option value="TOP5">Top 5</option>
              <option value="BOTTOM3">Bottom 3</option>
              <option value="BOTTOM5">Bottom 5</option>
              <option value="RANDOM3">Random 3</option>
              <option value="RANDOM5">Random 5</option>
            </select>
          </div>
          <div class="col-lg-2">
            <span>Recurring</span>
            <!-- <select formControlName="rule3" class="form-control1">
              <option selected value="0">No Recurring</option>
              <option value="2">2 hour</option>
              <option value="4">4 hour</option>
            </select> -->
            <div>
              {{ matslider.value }} : Hours
            </div>
            <mat-slider
              #matslider
              thumbLabel
              formControlName="rule3"
              tickInterval="1"
              min="1"
              max="12"></mat-slider>
          </div>
          <div class="col-lg-2">
            <div>&nbsp;</div>
            <button class="btn-success btn">
              Create Rule
            </button>
          </div>
        </form>
      </div>

      <br /><br />

      <div class="row">
        <div class="col-lg-12">
          <div class="main-box clearfix">
            <div class="table-responsive">
              <table class="table user-list">
                <thead>
                  <tr>
                    <th><span>Events</span></th>
                    <th><span>Coupon</span></th>
                    <th><span>Rule 1</span></th>
                    <th><span>Rule 2</span></th>
                    <th><span>Recurring</span></th>
                    <th><span>Action</span></th>
                  </tr>
                </thead>
                <tbody>
                  <tr>
                    <td>
                      <span class="user-subhead">Arjit Singh</span>
                    </td>
                    <td>
                      <span class="user-subhead">SAVE100</span>
                    </td>
                    <td class="text-center">
                      <span class="user-subhead">Presentees</span>
                    </td>
                    <td>
                      <span class="user-subhead">Top 2</span>
                    </td>
                    <td>
                      <span class="user-subhead">4 Hours</span>
                    </td>
                    <td style="width: 20%;">
                      <button data-toggle="tooltip" title="click to preview event" data-placement="bottom"
                        (click)="generateLottery()" class="btn-success btn">Generate Lottery
                      </button> &nbsp;
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>
