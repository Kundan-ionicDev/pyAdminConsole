<div id="page-wrapper">
  <div class="graphs">
    <div class="xs">
      <h3>Set Lottery Rules</h3>
      <div class="row">
        <form role="form" [formGroup]="lotteryrule" (ngSubmit)="generateRule()" class="form-horizontal">
          <div class="col-lg-2">
            <span>Select Events</span>
            <select formControlName="eventId" class="form-control1">
              <option selected value="0">Select Event</option>
              <option *ngFor="let cat of eventList" [value]="cat.eventId">{{cat.title}}</option>
            </select>
          </div>
          <div class="col-lg-2">
            <span>Select Coupon</span>
            <select formControlName="couponId" class="form-control1">
              <option selected value="0">Select Coupon</option>
              <option *ngFor="let coupn of couponList" [value]="coupn.couponId">{{ coupn.code }}</option>
            </select>
          </div>
          <div class="col-lg-2">
            <span>Rule 1</span>
            <select formControlName="rule1" class="form-control1">
              <option selected value="All">All(Both)</option>
              <option value="Present">Present</option>
              <option value="Absent">Absent</option>
            </select>
          </div>
          <div class="col-lg-2">
            <span>Rule 2</span>
            <select formControlName="rule2" class="form-control1">
              <option selected value="0">Select Rule2</option>
              <option value="1">Top 3</option>
              <option value="2">Bottom 3</option>
              <option value="3">Top 5</option>
              <option value="4">Bottom 5</option>
              <option value="5">Random 3</option>
              <option value="6">Random 5</option>
            </select>
          </div>
          <div class="col-lg-2">
            <span>Recurring</span>
            <!-- <div>
              {{ matslider.value }} : Hours
            </div>
            <mat-slider
              #matslider
              thumbLabel
              formControlName="rule3"
              tickInterval="1"
              min="1"
              max="12"></mat-slider> -->
              <select formControlName="rule2" class="form-control1">
                <option selected value="0">Select Rule3</option>
                <option value="0">None</option>
                <option value="2">2 Hours</option>
                <option value="4">4 Hours</option>
              </select>
          </div>
          <div class="col-lg-2">
            <div>&nbsp;</div>
            <button class="btn-success btn">
              Create Rule
            </button>
          </div>
        </form>
      </div>

      <br /><br />

      <div class="row">
        <div class="col-lg-12">
          <div class="main-box clearfix">
            <div class="table-responsive">
              <table class="table user-list">
                <thead>
                  <tr>
                    <th><span>Events</span></th>
                    <th><span>Coupon</span></th>
                    <th><span>Rule 1</span></th>
                    <th><span>Rule 2</span></th>
                    <th><span>Recurring</span></th>
                    <th><span>Action</span></th>
                  </tr>
                </thead>
                <tbody>
                  <tr *ngFor="let rules of lotteryruleData">
                    <td>
                      <span class="user-subhead">{{ rules.fk_event.title }}</span>
                    </td>
                    <td>
                      <span class="user-subhead">{{ rules.fk_coupon.code }}</span>
                    </td>
                    <td class="text-center">
                      <span class="user-subhead">{{ rules.rule1 }}</span>
                    </td>
                    <td>
                      <span class="user-subhead">{{ rules.rule2.label }}</span>
                    </td>
                    <td>
                      <span class="user-subhead">{{ rules.rule3 }} : hour</span>
                    </td>
                    <td style="width: 20%;">
                      <button data-toggle="tooltip" title="click to preview event" data-placement="bottom"
                        (click)="generateLottery(rules.lotteryId)" class="btn-success btn">Generate Lottery
                      </button> &nbsp;
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>
<ngx-loading [show]="loading" [config]="{animationType: ngxLoadingAnimationTypes.circleSwish, primaryColour: primaryColour, backdropBorderRadius: '3px'}"
      [template]="loadingTemplate"></ngx-loading>
