<div id="page-wrapper">
    <div class="col-md-12 graphs">
      <div class="xs">
        <h3>Lottery History</h3>
        <div class="container">
          <div class="row">
            <div class="col-lg-3">
              <select data-toggle="tooltip" title="Select Event Category!" data-placement="bottom"
                    name="selector1" class="form-control1">
                    <option value="0">Select</option>
                  </select>
            </div>
            <div class="col-lg-3">
              <select data-toggle="tooltip" title="Select Event Category!" data-placement="bottom"
                    name="selector1" class="form-control1">
                    <option value="0">Select</option>
                  </select>
            </div>
            <div class="col-lg-3">
              <button class="btn-success btn">
                Search
              </button>
            </div>
            <div class="col-lg-3">
              <button class="btn-success btn">
                Export to excel
              </button>
            </div>
          </div>
          <div class="row">
           <br />
          </div>

          <div class="row">
            <div class="col-lg-12">
              <div class="main-box clearfix">
                <div class="table-responsive">
                  <table class="table user-list" style="width: 100%;">
                    <thead>
                      <tr>
                        <th><span>Name</span></th>
                        <th><span>CheckIn</span></th>
                        <th class="text-center"><span>Status</span></th>
                        <th><span>EmailId</span></th>
                        <th><span>EventTitle</span></th>
                        <th><span>BookingId</span></th>
                        <th><span>CouponCode</span></th>
                        <th>Action</th>
                      </tr>
                    </thead>
                    <tbody>
                      <tr *ngFor="let user of eventusers">
                        <td>
                          {{ user.fk_eventbookings_user.name }}
                        </td>
                        <td>
                          {{ user.created_at | date:'MMM dd yyyy hh:mm a'  }}
                        </td>
                        <td class="text-center">
                          <span class="label label-success" *ngIf="user.isPresent == true">Present</span>
                          <span class="label label-default" *ngIf="user.isPresent == false">Absent</span>
                        </td>
                        <td>
                          <a href="">{{ user.fk_eventbookings_user.email }}</a>
                        </td>
                        <td>
                          {{ user.fk_eventbookings_events.title }}
                        </td>
                        <td>
                          {{ user.bookingId }}
                        </td>
                        <td>
                          <!-- {{ user.totalTickets }} -->
                          SAVE 100
                        </td>
                        <td style="width: 20%;">
                          <div class="custom-control custom-checkbox">
                            <input type="checkbox" class="custom-control-input" id="defaultChecked1" checked>
                            <label class="custom-control-label" for="defaultChecked2">&nbsp;Disbursement</label>
                          </div>
                          &nbsp;
                          <div class="custom-control custom-checkbox">
                            <input type="checkbox" class="custom-control-input" id="defaultChecked2" checked>
                            <label class="custom-control-label" for="defaultChecked2">&nbsp;Reimbursement</label>
                          </div>
                        </td>
                      </tr>
                     <hr>
                    </tbody>
                  </table>
                </div>
                <!-- <ul class="pagination pull-right">
                  <li><a href=""><i class="fa fa-chevron-left"></i></a></li>
                  <li><a href="">1</a></li>
                  <li><a href="">2</a></li>

                  <li><a href="">4</a></li>
                  <li><a href="">5</a></li>
                  <li><a href=""><i class="fa fa-chevron-right"></i></a></li>
                </ul> -->
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
