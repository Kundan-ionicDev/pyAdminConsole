<div id="page-wrapper">
  <ngx-loading [show]="loading" [config]="{ backdropBorderRadius: '3px' }" [template]="customLoadingTemplate"></ngx-loading>

    <div class="col-md-12 graphs">
      <div class="xs">
        <h3>Lottery History</h3>
        <div class="container">
          <div class="row">
            <div class="col-lg-3">
              <select data-toggle="tooltip" title="Select Event Category!" data-placement="bottom"
                    name="selector1" class="form-control1">
                    <option value="0">Select</option>
                    <option *ngFor="let event of eventlist" value="event.id">{{ event.title }}</option>
                  </select>
            </div>
            <div class="col-lg-3">
              <button class="btn-success btn">
                Search
              </button>
            </div>
            <div class="col-lg-3">
              <!-- <button class="btn-success btn">
                Export to excel
              </button> -->
            </div>
          </div>
          <div class="row">
           <br />
          </div>

          <div class="row">
            <div class="col-lg-12">
              <div class="main-box clearfix">
                <div class="table-responsive  scrolling_div">
                  <table class="table user-list">
                    <thead>
                      <tr>
                        <th><span>Name</span></th>
                        <th><span>CheckIn</span></th>
                        <th class="text-center"><span>Status</span></th>
                        <th><span>EmailId</span></th>
                        <th><span>EventTitle</span></th>
                        <th><span>BookingId</span></th>
                        <th><span>CouponCode</span></th>
                        <th>Action</th>
                      </tr>
                    </thead>
                    <tbody>
                      <tr *ngFor="let user of lotteryhistory">
                        <td>
                          {{ user.name }}
                        </td>
                        <td>
                          {{ user.checkInTime | date:'MMM dd yyyy hh:mm a'  }}
                        </td>
                        <td class="text-center">
                          <span class="label label-success" *ngIf="user.isPresent == true">Present</span>
                          <span class="label label-default" *ngIf="user.isPresent == false">Absent</span>
                        </td>
                        <td>
                          <a href="">{{ user.email }}</a>
                        </td>
                        <td>
                          {{ user.title }}
                        </td>
                        <td>
                          {{ user.bookingId }}
                        </td>
                        <td>
                          {{ user.code }}
                        </td>
                        <td style="width: 20%;">
                          <div >
                              <div class="custom-control custom-checkbox">
                                <input type="checkbox" class="custom-control-input" id="defaultChecked1">
                                <label class="custom-control-label" for="defaultChecked2">&nbsp;Disbursement</label>
                              </div>
                              &nbsp;
                              <div class="custom-control custom-checkbox">
                                <input type="checkbox" class="custom-control-input" id="defaultChecked2">
                                <label class="custom-control-label" for="defaultChecked2">&nbsp;Reimbursement</label>
                              </div>
                          </div>

                          <!-- <div *ngIf="user.isReimbursment !=null">
                            <div class="custom-control custom-checkbox">
                              <input type="checkbox" class="custom-control-input" id="defaultChecked1">
                              <label class="custom-control-label" for="defaultChecked2">&nbsp;Disbursement</label>
                            </div>
                            &nbsp;
                            <div class="custom-control custom-checkbox">
                              <input type="checkbox" class="custom-control-input" id="defaultChecked2">
                              <label class="custom-control-label" for="defaultChecked2">&nbsp;Reimbursement</label>
                            </div>
                          </div> -->
                        </td>
                      </tr>
                     <hr>
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
