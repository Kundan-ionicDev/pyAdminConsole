export default "<h2 mat-dialog-title>\n    Top 3 Winner's List\n</h2>\n\n<mat-dialog-content>\n    <mat-list role=\"list\">\n        <mat-list-item role=\"listitem\" *ngFor=\"let winner of data\">\n            <div>\n                <span matBadge=\" {{ winner.Rank }}\" matBadgeOverlap=\"false\">{{ winner.WinnerName }}</span>\n            </div>\n        </mat-list-item>\n      </mat-list>\n\n    <!-- <mat-accordion>\n        <mat-expansion-panel *ngFor=\"let winner of data\">\n          <mat-expansion-panel-header>\n            <mat-panel-title style=\"height: 10%;\">\n                {{ winner.WinnerName }}\n              <span matBadge=\" {{ winner.Rank }}\" matBadgeOverlap=\"false\"></span>\n            </mat-panel-title>\n            <mat-panel-description>\n              <span matBadge=\"4\" matBadgeOverlap=\"false\">Text with a badge</span>\n            </mat-panel-description>\n           \n          </mat-expansion-panel-header>\n         \n          <mat-form-field>\n            <mat-chip-list #chipList>\n                <mat-chip>{{ winner.Rank }}</mat-chip>\n                <mat-chip>Chip 2</mat-chip>\n              </mat-chip-list>\n          </mat-form-field>\n        </mat-expansion-panel>\n      </mat-accordion> -->\n      \n        <!-- this trigger right away -->\n        <!-- <p><ng2-odometer [number]=\"2000\" [config]=\"{ auto: false }\" [observable]=\"observable\" [theme]=\"'default'\"></ng2-odometer></p>\n        <p><ng2-odometer [number]=\"2000\" [config]=\"{ auto: false }\" [observable]=\"observable\" [theme]=\"'minimal'\"></ng2-odometer></p>\n        <p><ng2-odometer [number]=\"2000\" [config]=\"{ auto: false }\" [observable]=\"observable\" [theme]=\"'car'\"></ng2-odometer></p>\n        <p><ng2-odometer [number]=\"2000\" [config]=\"{ auto: false }\" [observable]=\"observable\" [theme]=\"'plaza'\"></ng2-odometer></p>\n        <p><ng2-odometer [number]=\"2000\" [config]=\"{ auto: false }\" [observable]=\"observable\" [theme]=\"'slot-machine'\"></ng2-odometer></p>\n        <p><ng2-odometer [number]=\"2000\" [config]=\"{ auto: false }\" [observable]=\"observable\" [theme]=\"'train-station'\"></ng2-odometer></p> -->\n        <!-- <p><ng2-odometer [number]=\"10000\" [config]=\"{ auto: true }\" [observable]=\"observable\" [theme]=\"'digital'\"></ng2-odometer></p>\n        <p><button (click)=\"trigger()\">Trigger</button></p> -->\n</mat-dialog-content>\n\n<mat-dialog-actions text-center>\n    <button mat-raised-button (click)=\"close()\" color=\"primary\">Ok</button>\n</mat-dialog-actions>\n"
