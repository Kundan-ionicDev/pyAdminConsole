export default "<h2 mat-dialog-title>\r\n    Winner's are ...\r\n</h2>\r\n<mat-dialog-content>\r\n    <mat-list role=\"list\">\r\n        <mat-list-item role=\"listitem\" *ngFor=\"let winner of data\">\r\n            <div>\r\n                {{ winner.name }}\r\n            </div>\r\n        </mat-list-item>\r\n      </mat-list>\r\n</mat-dialog-content>\r\n\r\n<mat-dialog-actions text-center>\r\n    <button mat-raised-button (click)=\"close()\" color=\"primary\">Ok</button>\r\n</mat-dialog-actions>\r\n"
